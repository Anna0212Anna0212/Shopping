<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>湊單搜尋｜找同時賣多樣商品的賣場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#eef1f5;--card:#fff;--ink:#1b2330;--mute:#5f6b7a;--line:#d3dae3;--link:#2457d6;--tape:#ffc933;--ok:#1a8a5a;--warn:#b4540a;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.6 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
a{color:var(--link)}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:28px 18px 80px}
h1{font-size:34px;font-weight:900;margin:0 0 4px}
.lead{margin:0 0 22px;color:var(--mute)}
h2{font-size:17px;font-weight:700;margin:30px 0 10px}
:focus-visible{outline:3px solid #7fa3ff;outline-offset:2px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;cursor:pointer}
.btn:hover:not(:disabled){border-color:#8896a8}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.small{padding:3px 10px;font-size:13px}
.linkbtn{border:0;background:none;color:var(--link);text-decoration:underline;cursor:pointer;padding:0;font-size:13px}
.ext{border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.ext.ok{background:#e3f4ec;color:var(--ok)}
.ext.no{background:#fff4d6;border:1px solid #e6c766;color:#5a4300}
.ext ol{margin:6px 0 2px;padding-left:20px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center}
.prod .n{font-weight:700;color:var(--mute);width:3.2em}
.prod input[type=text]{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.prod .meta{grid-column:2/4;font-size:12.5px;color:var(--mute)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.actions label{font-size:14px}
.actions select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
#status{margin-top:8px;font-size:14px;color:var(--mute);min-height:1.4em}
#status.err{color:#b3261e}
.filters{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:6px 0}
.row input[type=text],.row input[type=number],.row select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.row input[type=number]{width:96px}
.note{margin:0 0 10px;font-size:13.5px;color:var(--mute)}
.sum{margin:14px 0 8px;color:var(--mute)}
.sum b{color:var(--ink)}

.shop{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:10px;padding:12px 16px;margin:0 0 14px}
.shop.full{border-left-color:var(--tape)}
.shop-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.shop-h .name{font-weight:700;font-size:16px}
.badge{font-size:12px;border-radius:4px;padding:1px 7px;margin-left:8px;background:#e4e9ef;color:var(--mute)}
.shop.full .badge{background:var(--tape);color:#1b2330;font-weight:700}
.total{text-align:right;line-height:1.2}
.total b{font-size:28px;font-weight:900}
.total small{display:block;color:var(--mute);font-size:12px}
.bar{height:6px;background:#e4e9ef;border-radius:3px;margin:10px 0 2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--warn)}
.bar.done i{background:var(--ok)}
.barlabel{font-size:12.5px;color:var(--warn)}
.barlabel.done{color:var(--ok)}
.line{border-top:1px solid var(--line);padding:10px 0 4px;margin-top:10px}
.line:first-of-type{margin-top:8px}
.lt{font-size:12.5px;color:var(--mute);margin-bottom:4px}
.item{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:start}
.item img,.item .noimg{width:76px;height:76px;object-fit:cover;border-radius:6px;background:#e4e9ef;border:1px solid var(--line)}
.item .t{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink);text-decoration:none}
.item a.t:hover{text-decoration:underline}
.item .p{font-weight:900;font-size:19px}
.item .s{font-size:12px;color:var(--mute);margin-left:8px;font-weight:400}
.missing{font-size:13.5px;color:var(--mute)}
.cmp{margin-top:6px;font-size:13px}
.cmp>summary{cursor:pointer;color:var(--link)}
.list{margin-top:6px}
.list .item{padding:8px 0;border-top:1px solid var(--line);grid-template-columns:56px 1fr auto;gap:10px}
.list .item img,.list .item .noimg{width:56px;height:56px}
.list .item .p{font-size:16px}
.list .item.on{background:#fff8dc;margin:0 -6px;padding-left:6px;padding-right:6px}
.list .cheap{font-size:11px;background:#e3f4ec;color:var(--ok);border-radius:3px;padding:0 5px;margin-left:6px;font-weight:500}
.list .btns{display:flex;flex-direction:column;gap:4px}
.empty{background:var(--card);border:1px dashed #aab5c3;border-radius:10px;padding:20px;color:var(--mute)}
.empty b{color:var(--ink)}
footer{margin-top:40px;font-size:12.5px;color:var(--mute)}
@media (max-width:600px){h1{font-size:28px}.prod{grid-template-columns:1fr auto}.prod .n{display:none}.prod .meta{grid-column:1/3}}
</style>
</head>
<body>
<div class="wrap">
  <h1>湊單搜尋</h1>
  <p class="lead">輸入想買的商品，自動找出同一個賣場裡有賣的店，湊成一張訂單只付一次運費。</p>

  <div id="ext"></div>

  <h2>想買哪些商品？</h2>
  <p class="note">第 1 項請填<b>比較冷門的商品</b>（例：魔芋爽）。系統會先找出賣它的賣場，再到每個賣場裡搜尋其他商品（例：巧克力），所以不會因為大類商品太多而漏掉。</p>
  <div id="prods"></div>
  <div class="actions">
    <button class="btn" id="addBtn">新增商品（最多 6 件）</button>
    <label>第 1 項搜尋
      <select id="pages">
        <option value="1">1 頁（約 60 件）</option>
        <option value="2">2 頁</option>
        <option value="3">3 頁</option>
        <option value="5">5 頁</option>
        <option value="8">8 頁</option>
      </select></label>
    <label>最多檢查
      <select id="maxShops">
        <option value="10">10 個賣場</option>
        <option value="20">20 個賣場</option>
        <option value="40">40 個賣場</option>
        <option value="80">80 個賣場</option>
      </select></label>
    <button class="btn primary" id="goBtn">開始搜尋</button>
    <button class="btn" id="stopBtn" hidden>停止</button>
  </div>
  <div id="status"></div>

  <h2>篩選</h2>
  <div class="filters">
    <div class="row">
      <label>免運門檻 $<input type="number" id="thr" min="0" placeholder="例：199"></label>
      <label>至少要有 <select id="min"></select></label>
      <label>排序 <select id="sort">
        <option value="total">合計最低</option>
        <option value="gap">最接近免運門檻</option>
        <option value="cnt">商品選擇最多</option>
      </select></label>
    </div>
    <div class="row">
      <label>排除字 <input type="text" id="excl" placeholder="例：禮盒 試吃（空白分隔）"></label>
      <label><input type="checkbox" id="strict"> 商品標題必須包含我輸入的字</label>
    </div>
  </div>

  <div class="sum" id="sum"></div>
  <div id="results"></div>
  <div id="more"></div>

  <footer>資料只存在你自己的瀏覽器，不會上傳。價格與庫存以蝦皮商品頁為準，下單前請點進商品頁確認規格、數量與運費。</footer>
</div>

<script>
(function(){
'use strict';
const KEY='dualshop.v2',MAX=6;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'$'+Math.round(n).toLocaleString('en-US');
const uid=()=>'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);

const DEF=()=>({products:[{id:uid(),label:'',items:[]},{id:uid(),label:'',items:[]}],
  opt:{thr:'',excl:'',strict:false,sort:'total',min:'all',pages:'3',maxShops:'20'},hidden:[]});
let S=DEF();
try{const r=JSON.parse(localStorage.getItem(KEY)||'null');
  if(r&&Array.isArray(r.products)&&r.products.length){S=Object.assign(DEF(),r);S.opt=Object.assign(DEF().opt,r.opt||{})}}catch(e){}
let saveT;
const save=()=>{clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},200)};

const SEL={},OPEN=new Set();
let LIMIT=30,EXT=false,RUNNING=false;

/* ---------- 與擴充功能溝通 ---------- */
const post=m=>window.postMessage(Object.assign({src:'dualshop-page'},m),'*');
window.addEventListener('message',e=>{
  if(e.source!==window)return;
  const d=e.data;if(!d||d.src!=='dualshop-ext')return;
  if(d.type==='pong'){EXT=true;renderExt()}
  else if(d.type==='progress')setStatus(d.text);
  else if(d.type==='items')addItems(d.id,d.items);
  else if(d.type==='done'){RUNNING=false;setStatus(`搜尋完成，已檢查 ${d.shops} 個賣場。`);syncBtns()}
  else if(d.type==='error'){RUNNING=false;setStatus(d.message,true);syncBtns()}
});
let tries=0;(function ping(){post({type:'ping'});if(!EXT&&tries++<8)setTimeout(ping,400)})();

function setStatus(t,err){const s=$('#status');s.textContent=t;s.className=err?'err':''}
function renderExt(){
  $('#ext').innerHTML=EXT?'<div class="ext ok">已連線到「湊單搜尋連線」擴充功能，可以自動搜尋。</div>':
  `<div class="ext no"><b>需要先安裝一次擴充功能</b>（Chrome 或 Edge，電腦版），才能自動搜尋蝦皮：
  <ol><li><a href="dualshop-extension.zip" download>下載擴充功能 zip</a> 並解壓縮。</li>
  <li>網址列輸入 <code>chrome://extensions</code>（Edge 為 <code>edge://extensions</code>），開啟右上角「開發人員模式」。</li>
  <li>按「載入未封裝項目」，選擇解壓縮後的資料夾。</li>
  <li>回到這個頁面按 F5 重新整理。</li></ol></div>`;
  syncBtns();
}
function syncBtns(){
  $('#goBtn').disabled=!EXT||RUNNING;
  $('#stopBtn').hidden=!RUNNING;
  $('#addBtn').disabled=S.products.length>=MAX;
}

/* ---------- 資料 ---------- */
const prod=id=>S.products.find(p=>p.id===id);
function cleanItem(x){
  if(!x||!/^\d+$/.test(String(x.shopId))||!/^\d+$/.test(String(x.itemId)))return null;
  const price=Number(x.price);if(!isFinite(price)||price<=0)return null;
  return {shopId:String(x.shopId),itemId:String(x.itemId),title:String(x.title||'').slice(0,200),price,
    img:typeof x.img==='string'&&/^https:\/\//.test(x.img)?x.img:'',
    url:'https://shopee.tw/product/'+x.shopId+'/'+x.itemId,sold:String(x.sold||'').slice(0,12)};
}
let rT;const renderSoon=()=>{clearTimeout(rT);rT=setTimeout(render,150)};
function addItems(id,arr){
  const p=prod(id);if(!p)return;
  const m=new Map(p.items.map(i=>[i.itemId,i]));
  (arr||[]).forEach(x=>{const c=cleanItem(x);if(c)m.set(c.itemId,c)});
  p.items=[...m.values()];save();renderSoon();
}

/* ---------- 商品輸入列 ---------- */
function renderProds(){
  $('#prods').innerHTML=S.products.map((p,i)=>`<div class="prod" data-id="${p.id}">
    <span class="n">商品 ${i+1}</span>
    <input type="text" value="${esc(p.label)}" placeholder="${['例：泡椒筍','例：蜂蜜塊','例：辣椒醬','例：沖泡飲品','例：魷魚絲','例：堅果'][i]||'輸入商品名稱'}" data-label aria-label="商品 ${i+1} 名稱">
    ${S.products.length>1?`<button class="btn small" data-del="${p.id}" aria-label="移除商品 ${i+1}">移除</button>`:'<span></span>'}
    <div class="meta" data-meta></div></div>`).join('');
  syncBtns();updateMeta();
}
function updateMeta(){
  document.querySelectorAll('.prod').forEach(el=>{
    const p=prod(el.dataset.id);if(!p)return;
    const shops=new Set(p.items.map(i=>i.shopId)).size;
    el.querySelector('[data-meta]').textContent=p.items.length?`已取得 ${p.items.length} 件，分布在 ${shops} 個賣場`:'';
  });
}

/* ---------- 比對 ---------- */
function compute(){
  const P=S.products.filter(p=>p.label.trim());
  const hid=new Set(S.hidden);
  const ex=(S.opt.excl||'').toLowerCase().split(/\s+/).filter(Boolean);
  const shops=new Map();
  P.forEach((p,idx)=>{
    const terms=S.opt.strict?p.label.toLowerCase().split(/\s+/).filter(Boolean):[];
    p.items.forEach(i=>{
      const t=i.title.toLowerCase();
      if(hid.has(i.itemId)||ex.some(w=>t.includes(w))||!terms.every(w=>t.includes(w)))return;
      if(!shops.has(i.shopId))shops.set(i.shopId,P.map(()=>[]));
      shops.get(i.shopId)[idx].push(i);
    });
  });
  shops.forEach(arr=>arr.forEach(l=>l.sort((a,b)=>a.price-b.price)));
  return {P,shops};
}
const pickItem=(list,sid,pid)=>list.find(x=>x.itemId===(SEL[sid]||{})[pid])||list[0];

function itemMini(it){
  const img=it.img?`<img src="${esc(it.img)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:'<div class="noimg"></div>';
  return `<div class="item">${img}<div><a class="t" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title||'（無標題）')}</a>
    <div><span class="p">${fmt(it.price)}</span>${it.sold?`<span class="s">已售出 ${esc(it.sold)}</span>`:''}</div></div></div>`;
}
function listRows(sid,pid,list,selId){
  const min=list[0].price;
  return list.map(it=>{
    const img=it.img?`<img src="${esc(it.img)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:'<div class="noimg"></div>';
    const on=it.itemId===selId;
    return `<div class="item${on?' on':''}">${img}<div><a class="t" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title||'（無標題）')}</a>
      <div><span class="p">${fmt(it.price)}</span>${it.price===min?'<span class="cheap">最低</span>':''}${it.sold?`<span class="s">已售出 ${esc(it.sold)}</span>`:''}</div></div>
      <div class="btns"><button class="btn small${on?' primary':''}" data-pick="${esc(it.itemId)}" data-shop="${esc(sid)}" data-pid="${esc(pid)}">${on?'已選用':'選用'}</button>
      <button class="btn small" data-hide="${esc(it.itemId)}">不是這個</button></div></div>`;
  }).join('');
}
function shopCard(sid,lists,P){
  const thr=Number(S.opt.thr)||0;
  const chosen=lists.map((l,i)=>l.length?pickItem(l,sid,P[i].id):null);
  const have=chosen.filter(Boolean),total=have.reduce((s,x)=>s+x.price,0);
  const full=have.length===P.length;
  let bar='';
  if(thr){const done=total>=thr;
    bar=`<div class="bar${done?' done':''}"><i style="width:${Math.min(100,total/thr*100)}%"></i></div>
    <div class="barlabel${done?' done':''}">${done?`已達免運門檻 ${fmt(thr)}`:`距離免運門檻 ${fmt(thr)} 還差 ${fmt(thr-total)}`}</div>`}
  const lines=P.map((p,i)=>{
    const l=lists[i];
    if(!l.length)return `<div class="line"><div class="lt">${esc(p.label)}</div><div class="missing">此賣場沒有找到。<a href="https://shopee.tw/shop/${esc(sid)}/search?keyword=${encodeURIComponent(p.label)}" target="_blank" rel="noopener">到賣場內搜尋看看</a></div></div>`;
    const key=sid+'|'+p.id;
    return `<div class="line"><div class="lt">${esc(p.label)}</div>${itemMini(chosen[i])}
      <details class="cmp" data-open="${esc(key)}"${OPEN.has(key)?' open':''}><summary>此賣場有 ${l.length} 件，查看全部與比價</summary>
      <div class="list">${listRows(sid,p.id,l,chosen[i].itemId)}</div></details></div>`;
  }).join('');
  return `<article class="shop${full?' full':''}"><div class="shop-h">
    <div><a class="name" href="https://shopee.tw/shop/${esc(sid)}" target="_blank" rel="noopener">蝦皮賣場 #${esc(sid)}</a>
    <span class="badge">${full?`${P.length} 項都有`:`有 ${have.length}/${P.length} 項`}</span></div>
    <div class="total"><b>${fmt(total)}</b><small>${have.length} 件合計</small></div></div>${bar}${lines}</article>`;
}

function render(){
  updateMeta();
  // 「至少要有」選單
  const {P,shops}=compute();
  const sel=$('#min'),cur=S.opt.min;
  let opts='<option value="all">全部商品</option>';
  for(let k=P.length-1;k>=2;k--)opts+=`<option value="${k}">${k} 項以上</option>`;
  if(sel.innerHTML!==opts)sel.innerHTML=opts;
  sel.value=[...sel.options].some(o=>o.value===cur)?cur:'all';
  sel.disabled=P.length<3;

  const thr=Number(S.opt.thr)||0,need=P.length<3||S.opt.min==='all'?P.length:Math.min(Number(S.opt.min),P.length);
  const rows=[];
  shops.forEach((lists,sid)=>{
    const cov=lists.filter(l=>l.length).length;
    if(cov>=need&&cov>=Math.min(2,P.length)){
      const total=lists.reduce((s,l,i)=>s+(l.length?pickItem(l,sid,P[i].id).price:0),0);
      rows.push({sid,lists,cov,total,cnt:lists.reduce((s,l)=>s+l.length,0)});
    }
  });
  rows.sort((a,b)=>{
    if(b.cov!==a.cov)return b.cov-a.cov;
    if(S.opt.sort==='cnt')return b.cnt-a.cnt||a.total-b.total;
    if(S.opt.sort==='gap'&&thr){const ga=a.total-thr,gb=b.total-thr;return (ga>=0?ga:1e6-ga)-(gb>=0?gb:1e6-gb)}
    return a.total-b.total;
  });

  const withData=P.filter(p=>p.items.length).length;
  const sum=$('#sum'),res=$('#results'),more=$('#more');
  if(P.length<2){sum.textContent='';res.innerHTML='<div class="empty"><b>先輸入至少兩樣商品。</b><br>輸入後按「開始搜尋」，這裡會列出同時有賣的賣場。</div>';more.innerHTML='';return}
  if(!withData){sum.textContent='';res.innerHTML='<div class="empty"><b>還沒有搜尋結果。</b><br>按上方「開始搜尋」，擴充功能會自動到蝦皮搜尋並翻頁。</div>';more.innerHTML='';return}
  const empties=P.filter(p=>!p.items.length).map(p=>`「${esc(p.label)}」`);
  let s=rows.length?`找到 <b>${rows.length}</b> 個符合的賣場。`:'';
  if(empties.length)s+=` ${empties.join('、')}還沒有搜尋結果。`;
  if(S.hidden.length)s+=` 已隱藏 ${S.hidden.length} 件「不是這個」的商品 <button class="linkbtn" id="unhide">全部還原</button>`;
  sum.innerHTML=s;
  res.innerHTML=rows.length?rows.slice(0,LIMIT).map(r=>shopCard(r.sid,r.lists,P)).join(''):
    '<div class="empty"><b>沒有符合條件的賣場。</b><br>可以調低「至少要有」、取消「標題必須包含」、增加搜尋頁數，或換個關鍵字。</div>';
  more.innerHTML=rows.length>LIMIT?`<button class="btn" id="moreBtn">再顯示更多（還有 ${rows.length-LIMIT} 個）</button>`:'';
}

/* ---------- 事件 ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  const del=t.closest('[data-del]');
  if(del){S.products=S.products.filter(p=>p.id!==del.dataset.del);save();renderProds();render();return}
  const pk=t.closest('[data-pick]');
  if(pk){(SEL[pk.dataset.shop]||(SEL[pk.dataset.shop]={}))[pk.dataset.pid]=pk.dataset.pick;
    document.querySelectorAll('details.cmp[open]').forEach(d=>OPEN.add(d.dataset.open));render();return}
  const hd=t.closest('[data-hide]');
  if(hd){S.hidden.push(hd.dataset.hide);save();document.querySelectorAll('details.cmp[open]').forEach(d=>OPEN.add(d.dataset.open));render();return}
  if(t.id==='unhide'){S.hidden=[];save();render()}
  if(t.id==='moreBtn'){LIMIT+=30;render()}
});
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.open)d.open?OPEN.add(d.dataset.open):OPEN.delete(d.dataset.open)},true);
$('#prods').addEventListener('input',e=>{
  const el=e.target.closest('.prod');if(!el||!e.target.matches('[data-label]'))return;
  const p=prod(el.dataset.id);p.label=e.target.value;save();render();
});
$('#addBtn').addEventListener('click',()=>{
  if(S.products.length>=MAX)return;
  S.products.push({id:uid(),label:'',items:[]});save();renderProds();
  const ins=document.querySelectorAll('.prod input');ins[ins.length-1].focus();
});
$('#goBtn').addEventListener('click',()=>{
  const tasks=S.products.filter(p=>p.label.trim()).map(p=>({id:p.id,label:p.label.trim()}));
  if(tasks.length<2){setStatus('請至少輸入兩樣商品。',true);return}
  tasks.forEach(t=>{prod(t.id).items=[]});
  const maxShops=Number(S.opt.maxShops)||20;
  Object.keys(SEL).forEach(k=>delete SEL[k]);LIMIT=30;
  RUNNING=true;syncBtns();render();
  setStatus('已開始，會彈出一個小視窗自動搜尋，請不要關閉它（可以縮到旁邊）。');
  post({type:'search',anchor:tasks[0],others:tasks.slice(1),pages:Number(S.opt.pages)||3,maxShops});
});
$('#stopBtn').addEventListener('click',()=>{post({type:'cancel'})});

const bind=(id,key,check)=>{
  const el=$(id);
  if(check)el.checked=!!S.opt[key];else el.value=S.opt[key];
  el.addEventListener(check?'change':'input',()=>{S.opt[key]=check?el.checked:el.value;LIMIT=30;save();render()});
};
bind('#thr','thr');bind('#excl','excl');bind('#strict','strict',true);bind('#sort','sort');bind('#min','min');bind('#pages','pages');bind('#maxShops','maxShops');

renderProds();renderExt();render();
})();
</script>
</body>
</html>
